name: php and apache on the host platform

# Evidence for the pull request "Run apache and php on the platform of the
# host". Installs CE 7.6 with the upstream recipe on an x86_64 and an arm64
# runner, from upstream master and from the branch, then requests the start
# page and the admin login page.
#
# master on arm64 is expected to fail: the emulated apache exits. That job
# is allowed to fail, so the run shows the difference without turning red.

on:
  push:
    branches: [arch-ci-php-apache]

permissions:
  contents: read

jobs:
  shop:
    name: ${{ matrix.ref }} on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.ref == 'master' && matrix.arch == 'arm64' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: [master, no-platform-pin-php-apache]
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the checks
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Check out the SDK under test
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.ref == 'master' && 'OXID-eSales/docker-eshop-sdk' || github.repository }}
          ref: ${{ matrix.ref }}
          path: sdk

      - name: Clone the recipes
        run: git clone --recurse-submodules https://github.com/OXID-eSales/docker-eshop-sdk-recipes sdk/recipes/oxid-esales

      # Pinned amd64 images need emulation on the arm64 runner.
      - name: Enable amd64 emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - name: Prepare the host
        run: |
          echo "127.0.0.1 localhost.local" | sudo tee -a /etc/hosts
          sudo systemctl stop mysql apache2 nginx 2>/dev/null || true
          mkdir -p sdk/data/composer
          printf '{"github-oauth":{"github.com":"%s"}}' "${{ github.token }}" > sdk/data/composer/auth.json

      - name: Install CE 7.6 with the recipe
        working-directory: sdk
        # The recipes call "docker compose exec" without -T, which needs a terminal.
        run: script -qec "./recipes/oxid-esales/shop/b-7.6.x-apex-dev.sh -e CE" /dev/null

      - name: Check architecture, start page and admin
        working-directory: sdk
        env:
          SELENIUM_BLOCKING: 0
        run: |
          set -o pipefail
          ../ci/.github/arch-check/check.sh | tee ../result.tsv

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.ref }} on ${{ matrix.arch }}"
            echo '```'
            cat result.tsv 2>/dev/null || echo "no result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

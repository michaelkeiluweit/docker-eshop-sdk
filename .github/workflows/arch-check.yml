name: mysql platform from the env file

# Evidence for the pull request "Make the platform of the mysql service
# configurable". Starts the mysql service from services/mysql.yml on an
# x86_64 and an arm64 runner, from upstream master and from the branch, and
# records which platform the service resolves to with a fresh .env, with an
# .env without the variable and with the variable set to another platform.

on:
  push:
    branches: [arch-ci-mysql]

permissions:
  contents: read

jobs:
  mysql:
    name: ${{ matrix.ref }} on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref: [master, mysql-platform-configurable]
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the checks
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Check out the SDK under test
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.ref == 'master' && 'OXID-eSales/docker-eshop-sdk' || github.repository }}
          ref: ${{ matrix.ref }}
          path: sdk

      # The database image exists for amd64 only and needs emulation on arm64.
      - name: Enable amd64 emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - name: Stop the database of the runner
        run: sudo systemctl stop mysql 2>/dev/null || true

      - name: Start mysql from the service file and check it
        working-directory: sdk
        run: |
          set -o pipefail
          ../ci/.github/arch-check/mysql-service-check.sh | tee ../result.tsv

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.ref }} on ${{ matrix.arch }}"
            echo '```'
            cat result.tsv 2>/dev/null || echo "no result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

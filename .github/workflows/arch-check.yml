name: nginx on the host platform

# Evidence for the pull request "Run nginx on the platform of the host".
# Starts the nginx service from services/nginx-rp.yml on an x86_64 and an
# arm64 runner, from upstream master and from the branch, with a plain httpd
# as backend, then sends a proxied request and a request to a Lua location.
#
# master on arm64 is expected to fail: the emulated nginx cannot initialize
# its Lua VM. That job is allowed to fail, so the run shows the difference
# without turning red.

on:
  push:
    branches: [arch-ci-nginx]

permissions:
  contents: read

jobs:
  nginx:
    name: ${{ matrix.ref }} on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.ref == 'master' && matrix.arch == 'arm64' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ref: [master, no-platform-pin-nginx]
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the checks
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Check out the SDK under test
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.ref == 'master' && 'OXID-eSales/docker-eshop-sdk' || github.repository }}
          ref: ${{ matrix.ref }}
          path: sdk

      # The pinned amd64 image needs emulation on the arm64 runner.
      - name: Enable amd64 emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - name: Start nginx from the service file and check it
        working-directory: sdk
        run: |
          set -o pipefail
          ../ci/.github/arch-check/nginx-service-check.sh | tee ../result.tsv

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.ref }} on ${{ matrix.arch }}"
            echo '```'
            cat result.tsv 2>/dev/null || echo "no result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
